<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ============================================================
    TÍTULO Y DESCRIPCIÓN
    ============================================================ -->
    <title>Sentra Visión — Asistencia Visual Cognitiva</title>
    <meta name="description" content="Sentra Visión: asistencia visual soberana para personas ciegas y baja visión. IA local, offline-first, con veto humano y trazabilidad." />

    <!-- ============================================================
    PWA — MANIFEST Y CONFIGURACIÓN
    ============================================================ -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Tema de color para la barra de navegación (Android / Chrome) -->
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="background-color" content="#0a0a0f" />

    <!-- iOS / Safari Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sentra Visión" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- ============================================================
    ICONOS PARA DIFERENTES PLATAFORMAS
    ============================================================ -->
    <!-- Android / Chrome -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- Apple Touch Icon (iOS) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ============================================================
    META TAGS PARA REDES SOCIALES Y PREVIEWS
    ============================================================ -->
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sentra Visión — Asistencia Visual Cognitiva" />
    <meta property="og:description" content="Sentra Visión: asistencia visual soberana para personas ciegas. IA local, offline-first, veto humano y trazabilidad." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://sentra-vision.vercel.app" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sentra Visión — Asistencia Visual Cognitiva" />
    <meta name="twitter:description" content="Sentra Visión: asistencia visual soberana para personas ciegas. IA local, offline-first, veto humano y trazabilidad." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- ============================================================
    SEGURIDAD Y SEO
    ============================================================ -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Sentra Core Team" />
    <meta name="keywords" content="Sentra Visión, IA soberana, asistencia visual, offline-first, veto humano, trazabilidad, personas ciegas, accesibilidad" />

    <!-- ============================================================
    MODO DE COLOR (OS PREFERENCE)
    ============================================================ -->
    <meta name="color-scheme" content="dark" />

    <!-- ============================================================
    PRE-CONEXIÓN A DOMINIOS EXTERNOS (para mejorar performance)
    ============================================================ -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ============================================================
    FUENTES Y ESTILOS BASE
    ============================================================ -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <!-- Aplicación React — Sentra Visión -->
    <div id="root"></div>

    <!--
      ============================================================
      SERVICE WORKER REGISTRATION
      ============================================================
      Se registra automáticamente desde main.tsx
    -->

    <!--
      ============================================================
      SCRIPT DE CARGA DE TENSORFLOW (CDN FALLBACK)
      ============================================================
      Se carga desde main.tsx o desde el hook useRealModeSensors
    -->

    <!--
      ============================================================
      PWA INSTALLATION PROMPT
      ============================================================
      El navegador mostrará automáticamente el prompt de instalación
      si la PWA cumple con los criterios.
    -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
